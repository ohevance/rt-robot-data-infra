# 운영용 MQTT 브로커 설정 — 클라우드 VM(또는 실험실 서버)에 올릴 때. 개발용은 mosquitto.conf (같은 PC, 인증 없음).
#
# 리스너 둘:
#   1883  내부 전용. 도커 네트워크 안에서만 닿는다(compose 가 호스트에 공개하지 않는다) → 수집기 컨테이너가 쓴다. 인증 없음.
#   8883  외부. TLS(우리 자체 CA 가 발급한 서버 인증서) + 아이디/비밀번호(password_file). 장치(Pi·가상)·배포기·WSL 이 쓴다.
# 왜 둘인가: 수집기까지 TLS·비밀번호를 쓰게 하면 인증서 SAN 에 컨테이너 이름을 넣고 비밀번호를 컨테이너에 전달해야 한다 —
#   도커 네트워크가 이미 격리해 주므로 내부는 평문, 밖으로 나가는 문만 잠근다.
per_listener_settings true

listener 1883
allow_anonymous true

listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
allow_anonymous false
password_file /mosquitto/config/passwd

log_type error
log_type warning

# 개발용과 같은 이유로 (mosquitto.conf 의 설명 참고): 세션·보관 메시지를 디스크에, 수집기 끊김 때 큐 상한 20,000
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_queued_messages 20000
