# 개발용 MQTT 브로커 설정. 같은 PC 안에서만 쓰므로 인증 없음.
# (운영용은 mosquitto-prod.conf: 밖으로는 8883 TLS + 비밀번호만 연다 — 11/10. 장치별 인증서는 다음 단계)
listener 1883
allow_anonymous true
log_type error
log_type warning

# 세션·보관 메시지를 디스크에 남긴다 (docker-compose 의 fleet_mqtt_data 볼륨).
# 왜: persistence false 면 브로커가 재시작될 때 수집기의 "지속 세션(구독)"이 사라진다 → 수집기보다 먼저 재접속한 장치가
#     버퍼를 쏟아 내면 받는 사람이 없어 브로커가 버린다 (11/04 실측: 50대 중 4~5대 × 12개 유실). true 면 구독이 살아 있어 큐에 담긴다.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# 수집기가 --qos 1(지속 세션)로 붙어 있다가 잠깐 죽으면, 브로커가 그 동안의 QoS 1 메시지를 대신 들고 있는다.
# 기본값 1000 은 300대 × 1 Hz × 10초 = 3000 을 못 담으므로 늘린다. (장애 주입 --fault collector 가 이 값을 쓴다)
max_queued_messages 20000
