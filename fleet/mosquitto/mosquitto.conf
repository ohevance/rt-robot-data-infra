# 개발용 MQTT 브로커 설정. 같은 PC 안에서만 쓰므로 인증 없음.
# (현장용은 TLS + 사용자/비밀번호 또는 인증서. 그건 2주 계획 밖)
listener 1883
allow_anonymous true
persistence false
log_type error
log_type warning

# 수집기가 --qos 1(지속 세션)로 붙어 있다가 잠깐 죽으면, 브로커가 그 동안의 QoS 1 메시지를 대신 들고 있는다.
# 기본값 1000 은 300대 × 1 Hz × 10초 = 3000 을 못 담으므로 늘린다. (장애 주입 --fault collector 가 이 값을 쓴다)
max_queued_messages 20000
