# ---------------------------------------------------------------------------
# 관제 서버 한 벌 (3개 컨테이너 + 선택 1개). 공고 ②③ "실시간 로깅·모니터링·시각화" 의 몸통.
#
#   장치들 ──MQTT──▶ [mqtt: Mosquitto 브로커] ──▶ (collector.py 가 꺼내서) ──▶ [db: TimescaleDB] ──▶ [grafana: 상황판]
#
# 시작:  docker compose -f fleet/docker-compose.yml up -d
# 중지:  docker compose -f fleet/docker-compose.yml down        (데이터 유지)
# 초기화: docker compose -f fleet/docker-compose.yml down -v    (데이터까지 삭제)
# 수집기까지 컨테이너로:  docker compose -f fleet/docker-compose.yml --profile collector up -d
#   (기본은 수집기를 호스트에서 python3 로 띄운다 — 출력을 바로 보기 위해. 둘 다 띄우면 행이 두 배로 들어가니 하나만)
# ---------------------------------------------------------------------------
services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: fleet_mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: fleet_db
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - fleet_db_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: fleet_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - db

  # 선택: 수집기 컨테이너 (--profile collector 를 붙여야 뜬다)
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    container_name: fleet_collector
    profiles: ["collector"]
    environment:
      BROKER: mqtt
      DB_DSN: postgresql://fleet:fleet@db:5432/fleet
      COLLECTOR_QOS: ${COLLECTOR_QOS:-0}      # 1 이면 지속 세션 (수집기 끊김 시 유실 0)
    depends_on:
      - mqtt
      - db
    restart: unless-stopped

volumes:
  fleet_db_data: {}
