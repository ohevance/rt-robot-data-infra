# Grafana 가 뜰 때 자동으로 등록되는 데이터 소스 (TimescaleDB = PostgreSQL)
apiVersion: 1
datasources:
  - name: Timescale
    uid: timescale
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: fleet
    isDefault: true
    secureJsonData:
      password: fleet
    jsonData:
      database: fleet
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
