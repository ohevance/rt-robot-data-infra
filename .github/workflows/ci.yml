# ---------------------------------------------------------------------------
# CI (GitHub Actions) — push 할 때마다 GitHub 의 무료 리눅스 컴퓨터가 자동으로 세 가지 잡(job)을 돈다.
#
#   1) rt_core (1단계, ~2분)
#      rt_core 빌드 → 단위 테스트 4개(링 버퍼·제어 단계·상태 머신·MuJoCo 제외) → jitter_bench 1 kHz 2초 "드롭 0" 스모크
#      → 표① 생성 → fleet 단위 테스트 3개(가짜 브로커·가짜 DB) → 대시보드 JSON 검사
#   2) fleet_integration (2단계, ~5분)
#      진짜 Mosquitto·TimescaleDB 컨테이너 위에서 수집기 + 가상 장치 10대 → 장애 주입 3종 + 나쁜 펌웨어 롤백 + 정상 OTA(흉내)
#      + 산출물 OTA(11/10): 릴리스 패키지를 로컬 HTTP 로 → 장치가 내려받기·sha256·A/B 슬롯·자가 점검 → 정상 10/10, 깨진 패키지 거부·롤백
#      → "유실 0 · 복구됨 · 롤백됨 · 설치됨/거부됨" 판정 (fleet/tests/integration.sh 와 같은 스크립트)
#   릴리스(태그 → 패키지 → 가상 50대 카나리 → Release 게시)는 별도 워크플로 release.yml — docs/RELEASE.md
#   3) mujoco (2단계, ~1분)
#      MuJoCo 3.x 를 내려받아 rt_core 를 -DRT_CORE_WITH_MUJOCO=ON 으로 빌드, SO-ARM100(menagerie, 6 자유도) 모델로 백엔드 테스트 (화면 없음)
#      → 위로보틱스 공개 모델 ALLEX(48 자유도, 고정 커밋)를 받아 같은 테스트를 프로필의 운영점(500 Hz)으로 한 번 더
#
#   잡 순서: rt_core 가 먼저(싼 검사), 통과하면 fleet_integration 과 mujoco 가 나란히(needs: rt_core). 그림은 docs/ENVIRONMENT.md 5-3.
#
#   통과하면 README 의 배지가 초록색이 된다.
#   (무료 러너에는 RT 커널·RT 권한이 없으므로 여기 수치는 "돌아간다"의 증거이지 지연 수치의 증거가 아니다.
#    지연 수치는 노트북/Pi 실측으로 docs/measurements 에 둔다.)
# ---------------------------------------------------------------------------
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MUJOCO_VERSION: "3.3.2"     # scripts/get_mujoco.sh 와 같은 값. 바꾸면 둘 다 바꾼다

jobs:
  rt_core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ python3

      - name: Configure & build
        run: |
          cmake -S rt_control/rt_core -B build/rt_core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rt_core -j

      - name: Unit tests (ring, control step, state machine) + smoke (1 kHz, 2 s, zero drops)
        run: ctest --test-dir build/rt_core --output-on-failure

      - name: Jitter smoke with JSON
        run: ./build/rt_core/jitter_bench --no-rt --seconds 2 --period-us 1000 --label ci_runner --json build/jitter_ci.json

      - name: Table generator
        run: |
          python3 scripts/make_table1.py --jitter build/jitter_ci.json --out build/table1_ci.md
          cat build/table1_ci.md

      - name: Fleet unit tests (fake broker, fake DB — no containers)
        run: |
          python3 fleet/tests/test_fleet_logic.py
          python3 fleet/tests/test_ota_rollout.py
          python3 fleet/tests/test_ota_artifact.py
          python3 fleet/tests/test_collector_resilience.py

      - name: Dashboard JSON is valid
        run: python3 fleet/grafana/make_dashboard.py && python3 -c "import json; json.load(open('fleet/grafana/provisioning/dashboards/fleet_overview.json'))"

      - uses: actions/upload-artifact@v5
        with:
          name: jitter-ci
          path: |
            build/jitter_ci.json
            build/table1_ci.md

  fleet_integration:
    runs-on: ubuntu-24.04
    needs: rt_core
    steps:
      - uses: actions/checkout@v5

      - name: Python deps
        run: pip install -r fleet/requirements.txt

      - name: Toolchain for the release package (jitter_bench is the 'firmware' the devices install)
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Broker + DB + collector + 10 virtual devices → faults → asserts (+ artifact OTA good/bad)
        run: KEEP=0 bash fleet/tests/integration.sh
        timeout-minutes: 15

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: fleet-integration
          path: build/integration/

  mujoco:
    runs-on: ubuntu-24.04
    needs: rt_core
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ git

      - name: Download MuJoCo ${{ env.MUJOCO_VERSION }} + SO-ARM100 model (menagerie)
        run: bash scripts/get_mujoco.sh "$MUJOCO_VERSION"

      - name: Build with MuJoCo backend
        run: |
          cmake -S rt_control/rt_core -B build/rt_core_mj -DCMAKE_BUILD_TYPE=Release \
                -DRT_CORE_WITH_MUJOCO=ON -DMUJOCO_DIR=$PWD/third_party/mujoco
          cmake --build build/rt_core_mj -j

      - name: MuJoCo backend test (headless, 1 kHz x 2000 cycles)
        env:
          RT_MUJOCO_MODEL: ${{ github.workspace }}/third_party/mujoco_menagerie/trs_so_arm100/so_arm100.xml
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/mujoco/lib
        run: ctest --test-dir build/rt_core_mj --output-on-failure -R mujoco

      # 같은 테스트를 위로보틱스 공개 모델 ALLEX(48 자유도)로 — 제어 코드·백엔드는 그대로, 프로필의 관절 이름만 넘긴다.
      - name: Download ALLEX model (WIRobotics, BSD-3, pinned commit)
        run: bash scripts/get_allex.sh

      # 주기는 프로필과 같은 500 Hz(2 ms). 1 kHz 측정(E21, WSL)에서 p99 622 us 로 러너에서는 900 us 문턱에 걸릴 수 있어 운영점으로 잰다.
      - name: MuJoCo backend test — ALLEX 48 DOF (headless, 500 Hz x 2 s)
        env:
          RT_MUJOCO_MODEL: ${{ github.workspace }}/third_party/allex_model/mjcf/scene.xml
          RT_MUJOCO_DOF: "48"
          RT_MUJOCO_PERIOD_US: "2000"
          RT_MUJOCO_OUT: mujoco_backend_allex_ci.json
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/mujoco/lib
        run: |
          pip install --quiet pyyaml
          export RT_MUJOCO_JOINTS="$(python3 scripts/profile_joints.py robots/allex.yaml)"
          cd build/rt_core_mj && ./test_mujoco_backend

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mujoco-ci
          path: |
            build/rt_core_mj/mujoco_backend_ci.json
            build/rt_core_mj/mujoco_backend_allex_ci.json
          if-no-files-found: ignore
