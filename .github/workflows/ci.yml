# ---------------------------------------------------------------------------
# CI (GitHub Actions)
#   push 할 때마다 GitHub의 무료 리눅스 컴퓨터가 자동으로:
#     1) rt_core를 빌드하고
#     2) 링 버퍼 단위 테스트를 돌리고
#     3) jitter_bench를 1 kHz로 2초 돌려 "로깅이 RT 루프를 못 따라가 드롭이 생기면 실패"
#     4) 표① 생성기가 결과를 표로 만드는지 확인한다
#   통과하면 README의 배지가 초록색이 된다.
#   (무료 러너에는 RT 커널·RT 권한이 없으므로 여기 수치는 "돌아간다"의 증거이지
#    지연 수치의 증거가 아니다. 지연 수치는 노트북 실측으로 docs/measurements 에 둔다.)
# ---------------------------------------------------------------------------
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rt_core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ python3

      - name: Configure & build
        run: |
          cmake -S rt_control/rt_core -B build/rt_core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rt_core -j

      - name: Unit test (spsc ring) + smoke (1 kHz, 2 s, zero drops)
        run: ctest --test-dir build/rt_core --output-on-failure

      - name: Jitter smoke with JSON
        run: ./build/rt_core/jitter_bench --no-rt --seconds 2 --period-us 1000 --label ci_runner --json build/jitter_ci.json

      - name: Table generator
        run: |
          python3 scripts/make_table1.py --jitter build/jitter_ci.json --out build/table1_ci.md
          cat build/table1_ci.md

      - uses: actions/upload-artifact@v4
        with:
          name: jitter-ci
          path: |
            build/jitter_ci.json
            build/table1_ci.md
