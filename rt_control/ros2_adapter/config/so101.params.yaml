# 자동 생성: robots/so101.yaml 에서 (scripts/profile_to_params.py). 손으로 고치지 말 것.
rt_control_node:
  ros__parameters:
    joint_names:
    - shoulder_pan
    - shoulder_lift
    - elbow_flex
    - wrist_flex
    - wrist_roll
    - gripper
    loop_hz: 1000
    prio: 80
    cpu: -1
    watchdog_ms: 50
    max_step_rad: 0.05
    publish_hz: 100
    sim_time_constant_s: 0.05
