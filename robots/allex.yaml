# ---------------------------------------------------------------------------
# 로봇 프로필: ALLEX (위로보틱스 공개 시뮬레이션 모델) — 자리 표시
#
# 2주 계획에서는 사용하지 않는다. 지원 후 면접 전에 추가 예정.
# 추가할 때 바뀌는 것은 이 파일(관절 목록·모델 경로)뿐이어야 한다.
#   - 모델: MJCF (MuJoCo), USD (Isaac Sim), URDF (ROS) — 회사 공개 저장소 라이선스 확인 후
#   - 실물은 없다 → 시뮬 전용 프로필 (sim 만 정의)
# ---------------------------------------------------------------------------
name: allex
dof: null                  # 모델에서 읽어 채움
joints: []                 # 모델에서 읽어 채움
loop_hz:
  sim: 1000
backend:
  sim: mujoco
mujoco:
  model: third_party/allex_model/mjcf/scene.xml   # 경로는 저장소 구조 확인 후 수정
limits_rad: {}
safety:
  watchdog_ms: 50
  max_step_rad: 0.05
