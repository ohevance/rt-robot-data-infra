# ---------------------------------------------------------------------------
# 로봇 프로필: SO-101 (The Robot Studio, LeRobot 공식 지원 저가 로봇팔)
#
# 제어 노드는 이 파일만 바꿔 다른 로봇을 지원한다.
#   - 관절 수(dof)만큼 버퍼를 "시작할 때 한 번" 고정 크기로 잡는다 (루프 안 동적 할당 금지)
#   - 루프 주기·백엔드·한계값은 전부 여기서 읽는다
#   - scripts/profile_to_params.py 가 이 파일을 ROS 2 파라미터 파일로 바꾼다 (손으로 두 번 쓰지 않기 위해)
# ---------------------------------------------------------------------------
name: so101
dof: 6
joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]   # 우리 쪽(ROS 토픽) 관절 이름

loop_hz:
  sim: 1000      # MuJoCo: 1 kHz
  real: 200      # Feetech STS3215 서보 6개, 시리얼 1 Mbps 버스 한계 (실측 후 조정)

backend:
  sim: mujoco            # sim 모드 기본 백엔드. MuJoCo 가 없으면 profile_to_params.py --backend sim_lag 로 1차 지연 모델
  real: feetech_serial

mujoco:
  # MuJoCo Menagerie (Google DeepMind) 의 검증된 모델. scripts/get_mujoco.sh 가 third_party/ 에 받는다.
  # SO-ARM100 과 SO-101 은 같은 5축+그리퍼 구성. 메나제리에 trs_so_arm101 폴더가 있으면 그쪽으로 바꿔도 된다.
  model: third_party/mujoco_menagerie/trs_so_arm100/scene.xml
  # 위 joints 와 같은 순서로, "모델 안의" 관절 이름. 틀리면 노드가 모델의 관절 이름 전체를 출력하니 그걸 보고 맞춘다.
  # 비워 두면([]) 모델의 1축 관절을 앞에서부터 6개 쓴다.
  joints: [Rotation, Pitch, Elbow, Wrist_Pitch, Wrist_Roll, Jaw]

sim_lag:
  time_constant_s: 0.05  # 1차 지연 모델의 시정수 (50 ms: 목표의 63% 까지 가는 시간)

serial:
  port: /dev/ttyACM0
  baud: 1000000
  servo_ids: [1, 2, 3, 4, 5, 6]

# 관절 한계(rad)는 모델 파일에서 읽어 채운다 — 2주차. 아래는 자리만.
limits_rad: {}

safety:
  watchdog_ms: 50      # 명령이 이 시간 동안 끊기면 토크 오프(안전 정지)
  max_step_rad: 0.05   # 한 주기에 허용하는 최대 목표 변화량 (급변 명령 차단)
